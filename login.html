<script>
function vapeGetUsers(){try{return JSON.parse(localStorage.getItem('vape_users')||'{}');}catch(e){return{};}}
function vapeSaveUsers(u){try{localStorage.setItem('vape_users',JSON.stringify(u));}catch(e){}}
function vapeEnc(p){try{return btoa(unescape(encodeURIComponent(p)));}catch(e){return p;}}
function vapeErr(m){var e=document.getElementById('vape-err')||document.getElementById('auth-err');if(e){e.textContent=m;e.style.display='block';}else{alert(m);}}
function vapeDoRegister(u,email,pw){
 if(!u){vapeErr('Enter username.');return false;}
 if(!email||email.indexOf('@')<0){vapeErr('Enter valid email.');return false;}
 if(!pw||pw.length<4){vapeErr('Password must be at least 4 characters.');return false;}
 var users=vapeGetUsers();
 if(users[u]){vapeErr('Username already registered. Login instead.');return false;}
 users[u]={email:email,pw:vapeEnc(pw)};
 vapeSaveUsers(users);
 try{localStorage.setItem('vape_user',u);}catch(e){}
 return true;}
function vapeDoLogin(u,pw){
 if(!u){vapeErr('Enter username.');return false;}
 if(!pw){vapeErr('Enter password.');return false;}
 var users=vapeGetUsers();
 if(!users[u]){for(var k in users){if(users[k].email===u){u=k;break;}}}
 if(!users[u]){vapeErr('Account not found. Register first.');return false;}
 if(users[u].pw!==vapeEnc(pw)){vapeErr('Wrong password.');return false;}
 try{localStorage.setItem('vape_user',u);}catch(e){}
 return true;}
</script><script>
function pageLogin(ev){ev.preventDefault();
 var i=document.getElementById('user_login');
 var pw=document.getElementById('user_pass');
 var u=i?i.value.trim():'';
 if(vapeDoLogin(u,pw?pw.value:'')){location.href='pricing.html';}return false;}
</script></body>
